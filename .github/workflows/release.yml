name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            directory="git-rg_${version}_${os}_${arch}"
            mkdir -p "dist/${directory}"
            binary="git-rg"
            if [[ "${os}" == "windows" ]]; then binary="git-rg.exe"; fi
            GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${version}" \
              -o "dist/${directory}/${binary}" ./cmd/git-rg
            if [[ "${os}" == "windows" ]]; then
              (cd dist && zip -q -r "${directory}.zip" "${directory}")
            else
              tar -C dist -czf "dist/${directory}.tar.gz" "${directory}"
            fi
            rm -rf "dist/${directory}"
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
